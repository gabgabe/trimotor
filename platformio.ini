[env:teensy36]
platform = teensy
board = teensy36
framework = arduino
lib_deps = 
	waspinator/AccelStepper@^1.61
	stan-reifel/FlexyStepper@^1.0.0
	ssilverman/TeensyDMX@^4.3.0-snapshot
	arkhipenko/TaskScheduler@^3.6.0
	sstaub/Ticker@^4.4.0
	luni64/TeensyStep@^2.1
